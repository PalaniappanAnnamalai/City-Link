spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/citypulse_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Pacific/Auckland
spring.datasource.username=root
spring.datasource.password=compx-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


management.endpoints.web.exposure.include=health,info

logging.level.com.nz.citypulse=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=INFO